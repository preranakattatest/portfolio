<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#141414"/>
  
  <!-- Audio Waveform / Acoustic Geometric Lines -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.7">
    <line x1="80" y1="280" x2="80" y2="320"/>
    <line x1="110" y1="250" x2="110" y2="350"/>
    <line x1="140" y1="220" x2="140" y2="380"/>
    <line x1="170" y1="180" x2="170" y2="420"/>
    <line x1="200" y1="230" x2="200" y2="370"/>
    <line x1="230" y1="140" x2="230" y2="460" stroke-width="3"/>
    <line x1="260" y1="200" x2="260" y2="400"/>
    <line x1="290" y1="100" x2="290" y2="500" stroke-width="4"/>
    <line x1="320" y1="170" x2="320" y2="430"/>
    <line x1="350" y1="130" x2="350" y2="470" stroke-width="3"/>
    <line x1="380" y1="210" x2="380" y2="390"/>
    <line x1="410" y1="160" x2="410" y2="440"/>
    <line x1="440" y1="240" x2="440" y2="360"/>
    <line x1="470" y1="200" x2="470" y2="400"/>
    <line x1="500" y1="260" x2="500" y2="340"/>
    <line x1="530" y1="280" x2="530" y2="320"/>
  </g>
  
  <!-- Dial / Speaker Ring -->
  <circle cx="300" cy="300" r="180" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 14" opacity="0.3"/>
  <circle cx="300" cy="300" r="220" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>

  <!-- Info Header -->
  <rect x="60" y="60" width="220" height="28" fill="#ffffff"/>
  <text x="170" y="79" fill="#000000" font-family="'Courier New', monospace" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">ACOUSTIC HARDWARE</text>
  
  <text x="540" y="540" fill="#ffffff" font-family="'Courier New', monospace" font-size="18" font-weight="bold" text-anchor="end" letter-spacing="4">HARMONY // 04</text>
  <text x="540" y="565" fill="#888888" font-family="'Courier New', monospace" font-size="10" text-anchor="end" letter-spacing="1">INDUSTRIAL PRODUCT DESIGN</text>
</svg>
