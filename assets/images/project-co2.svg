<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCO2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19281e"/>
      <stop offset="60%" stop-color="#142018"/>
      <stop offset="100%" stop-color="#0f1912"/>
    </linearGradient>
    <pattern id="hexGrid" width="16" height="28" patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 16 4.5 L 16 13.5 L 8 18 L 0 13.5 L 0 4.5 Z" fill="none" stroke="#e0eae2" stroke-width="0.8" opacity="0.12"/>
      <path d="M 8 14 L 16 18.5 L 16 27.5 L 8 32 L 0 27.5 L 0 18.5 Z" fill="none" stroke="#e0eae2" stroke-width="0.8" opacity="0.12"/>
    </pattern>
  </defs>
  
  <!-- Base Background -->
  <rect width="600" height="600" fill="url(#bgCO2)"/>
  <rect width="600" height="600" fill="url(#hexGrid)"/>
  
  <!-- Technical Dimension Overlay -->
  <g stroke="#e0eae2" stroke-width="1" opacity="0.2">
    <line x1="50" y1="50" x2="550" y2="50" stroke-dasharray="4 4"/>
    <line x1="50" y1="550" x2="550" y2="550" stroke-dasharray="4 4"/>
    <line x1="50" y1="50" x2="50" y2="550" stroke-dasharray="4 4"/>
    <line x1="550" y1="50" x2="550" y2="550" stroke-dasharray="4 4"/>
  </g>

  <!-- Enclosure Body Schematic Illustration -->
  <g transform="translate(160, 90)">
    <!-- Main Shell -->
    <rect x="0" y="30" width="280" height="380" rx="6" fill="#1b2a20" stroke="#e0eae2" stroke-width="2.5"/>
    
    <!-- Mounting Tabs -->
    <rect x="-35" y="190" width="35" height="60" rx="4" fill="#152119" stroke="#e0eae2" stroke-width="2"/>
    <circle cx="-17" cy="220" r="7" fill="#0f1912" stroke="#e0eae2" stroke-width="1.5"/>
    
    <rect x="280" y="190" width="35" height="60" rx="4" fill="#152119" stroke="#e0eae2" stroke-width="2"/>
    <circle cx="297" cy="220" r="7" fill="#0f1912" stroke="#e0eae2" stroke-width="1.5"/>

    <!-- Screen Bezel & Sensor Window -->
    <rect x="50" y="60" width="180" height="90" rx="4" fill="#0b130e" stroke="#e0eae2" stroke-width="2"/>
    <text x="140" y="112" fill="#7da585" font-family="'Space Mono', monospace" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">412 PPM</text>
    <text x="140" y="132" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="10" text-anchor="middle">CO2 • OPTIMAL</text>

    <!-- Hexagonal Ventilation Grille Section -->
    <g transform="translate(60, 180)" stroke="#e0eae2" stroke-width="1.5" fill="#0b130e">
      <!-- Row 1 -->
      <polygon points="20,0 28,5 28,15 20,20 12,15 12,5"/>
      <polygon points="50,0 58,5 58,15 50,20 42,15 42,5"/>
      <polygon points="80,0 88,5 88,15 80,20 72,15 72,5"/>
      <polygon points="110,0 118,5 118,15 110,20 102,15 102,5"/>
      <polygon points="140,0 148,5 148,15 140,20 132,15 132,5"/>
      <!-- Row 2 -->
      <polygon points="35,16 43,21 43,31 35,36 27,31 27,21"/>
      <polygon points="65,16 73,21 73,31 65,36 57,31 57,21"/>
      <polygon points="95,16 103,21 103,31 95,36 87,31 87,21"/>
      <polygon points="125,16 133,21 133,31 125,36 117,31 117,21"/>
      <!-- Row 3 -->
      <polygon points="20,32 28,37 28,47 20,52 12,47 12,37"/>
      <polygon points="50,32 58,37 58,47 50,52 42,47 42,37"/>
      <polygon points="80,32 88,37 88,47 80,52 72,47 72,37"/>
      <polygon points="110,32 118,37 118,47 110,52 102,47 102,37"/>
      <polygon points="140,32 148,37 148,47 140,52 132,47 132,37"/>
      <!-- Row 4 -->
      <polygon points="35,48 43,53 43,63 35,68 27,63 27,53"/>
      <polygon points="65,48 73,53 73,63 65,68 57,63 57,53"/>
      <polygon points="95,48 103,53 103,63 95,68 87,63 87,53"/>
      <polygon points="125,48 133,53 133,63 125,68 117,63 117,53"/>
    </g>

    <!-- Vertical Vent Slots -->
    <g stroke="#e0eae2" stroke-width="2" opacity="0.6">
      <line x1="60" y1="280" x2="220" y2="280"/>
      <line x1="60" y1="300" x2="220" y2="300"/>
      <line x1="60" y1="320" x2="220" y2="320"/>
      <line x1="60" y1="340" x2="220" y2="340"/>
    </g>

    <!-- Wires exiting base -->
    <path d="M 120 410 Q 110 460 70 480" fill="none" stroke="#54785b" stroke-width="3"/>
    <path d="M 140 410 Q 140 470 120 490" fill="none" stroke="#e0eae2" stroke-width="2.5"/>
    <path d="M 160 410 Q 170 460 210 480" fill="none" stroke="#7da585" stroke-width="3"/>
  </g>

  <!-- Technical Spec Labels -->
  <rect x="50" y="50" width="180" height="24" fill="#e0eae2"/>
  <text x="140" y="66" fill="#121d15" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">8 UNITS SHIPPED</text>
  
  <text x="50" y="530" fill="#e0eae2" font-family="'Space Mono', monospace" font-size="18" font-weight="900" letter-spacing="2">CO2 TRANSMITTER</text>
  <text x="50" y="555" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="11" letter-spacing="1">RAPID PROTOTYPING • FDM ENCLOSURE</text>
</svg>
