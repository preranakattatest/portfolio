<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#p1Grad)"/>
  
  <!-- Grid Matrix -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.15">
    <line x1="60" y1="0" x2="60" y2="600"/>
    <line x1="180" y1="0" x2="180" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="420" y1="0" x2="420" y2="600"/>
    <line x1="540" y1="0" x2="540" y2="600"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="420" x2="600" y2="420"/>
    <line x1="0" y1="540" x2="600" y2="540"/>
  </g>

  <!-- Abstract UI App Interface Wireframe -->
  <rect x="100" y="100" width="400" height="320" rx="4" fill="#181818" stroke="#ffffff" stroke-width="2"/>
  <rect x="100" y="100" width="400" height="36" fill="#292929" stroke="#ffffff" stroke-width="2"/>
  <circle cx="125" cy="118" r="6" fill="#ffffff" opacity="0.6"/>
  <circle cx="145" cy="118" r="6" fill="#ffffff" opacity="0.4"/>
  <circle cx="165" cy="118" r="6" fill="#ffffff" opacity="0.2"/>
  
  <!-- Sidebar & Content Blocks -->
  <rect x="120" y="156" width="90" height="240" fill="#202020"/>
  <rect x="135" y="175" width="60" height="12" fill="#ffffff" opacity="0.8"/>
  <rect x="135" y="200" width="50" height="8" fill="#ffffff" opacity="0.3"/>
  <rect x="135" y="218" width="55" height="8" fill="#ffffff" opacity="0.3"/>
  <rect x="135" y="236" width="45" height="8" fill="#ffffff" opacity="0.3"/>

  <!-- Main Chart & Cards -->
  <rect x="230" y="156" width="250" height="100" fill="#202020" stroke="#444444" stroke-width="1"/>
  <polyline points="245,230 290,200 340,220 390,175 435,190 465,165" fill="none" stroke="#ffffff" stroke-width="3"/>
  
  <rect x="230" y="276" width="115" height="120" fill="#202020"/>
  <rect x="365" y="276" width="115" height="120" fill="#202020"/>

  <!-- Brutalist Typography Stamp -->
  <text x="60" y="520" fill="#ffffff" font-family="'Courier New', monospace" font-size="28" font-weight="900" letter-spacing="4">CLOUDSYNC // 01</text>
  <text x="60" y="550" fill="#888888" font-family="'Courier New', monospace" font-size="12" letter-spacing="2">SYSTEM ARCHITECTURE • UI/UX PROTO</text>
</svg>
