<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDataLog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2a20"/>
      <stop offset="100%" stop-color="#101a13"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgDataLog)"/>

  <!-- Parametric CAD Crosshair & Guide Lines -->
  <g stroke="#e0eae2" stroke-width="1" opacity="0.15">
    <circle cx="300" cy="270" r="220" fill="none" stroke-dasharray="6 6"/>
    <line x1="80" y1="270" x2="520" y2="270"/>
    <line x1="300" y1="50" x2="300" y2="490"/>
  </g>

  <!-- Data Logger Isometric / Front Chassis with Chamfers -->
  <g transform="translate(140, 90)">
    <!-- Main Shell with Chamfered Corners -->
    <polygon points="30,0 290,0 320,30 320,270 290,300 30,300 0,270 0,30" fill="#1e2f24" stroke="#e0eae2" stroke-width="3"/>
    
    <!-- Tactile Side Grip Grooves -->
    <g stroke="#e0eae2" stroke-width="2" opacity="0.7">
      <line x1="10" y1="110" x2="10" y2="190"/>
      <line x1="18" y1="115" x2="18" y2="185"/>
      <line x1="310" y1="110" x2="310" y2="190"/>
      <line x1="302" y1="115" x2="302" y2="185"/>
    </g>

    <!-- Center Display & Control Bezel -->
    <rect x="55" y="45" width="210" height="210" rx="4" fill="#0d1610" stroke="#e0eae2" stroke-width="2"/>
    <rect x="75" y="65" width="170" height="170" fill="#142118"/>

    <!-- Two-Part Snap Mechanism Visual -->
    <g transform="translate(100, 95)" stroke="#7da585" stroke-width="2" fill="none">
      <rect x="0" y="0" width="120" height="110" rx="4" stroke="#e0eae2"/>
      <path d="M 25 20 L 45 20 L 45 60 L 35 70 L 25 70 Z" fill="#203326"/>
      <path d="M 95 20 L 75 20 L 75 60 L 85 70 L 95 70 Z" fill="#203326"/>
      <!-- Slide-in Arrow -->
      <line x1="60" y1="25" x2="60" y2="65" stroke="#e0eae2" stroke-width="2.5"/>
      <polyline points="50,55 60,65 70,55" stroke="#e0eae2" stroke-width="2.5"/>
    </g>

    <!-- Draft Angle Technical Annotations -->
    <text x="160" y="290" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="1">DRAFT ANGLE: 1.5° • DFM OPTIMISED</text>
  </g>

  <!-- Technical Spec Labels -->
  <rect x="50" y="50" width="220" height="24" fill="#e0eae2"/>
  <text x="160" y="66" fill="#121d15" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">DESIGN FOR MANUFACTURING</text>

  <text x="50" y="530" fill="#e0eae2" font-family="'Space Mono', monospace" font-size="18" font-weight="900" letter-spacing="2">DATA LOGGER REDESIGN</text>
  <text x="50" y="555" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="11" letter-spacing="1">PARAMETRIC CAD • SLIDE &amp; SNAP WALL MOUNT</text>
</svg>
