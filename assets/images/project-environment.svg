<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEnv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18291f"/>
      <stop offset="100%" stop-color="#0c150f"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgEnv)"/>

  <!-- Split Perspective Architecture & Prop Visual -->
  <g transform="translate(60, 90)">
    <!-- Left: Norse Architecture Silhouette (Fimbulwinter) -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="225" height="300" fill="#131e16" stroke="#e0eae2" stroke-width="2"/>
      <rect x="15" y="15" width="195" height="22" fill="#e0eae2"/>
      <text x="112" y="30" fill="#121d15" font-family="'Space Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">FIMBULWINTER // NORSE</text>

      <!-- Longhouse and Watchtower Silhouette -->
      <g transform="translate(20, 70)" stroke="#e0eae2" stroke-width="2" fill="#1c2d22">
        <!-- Watchtower on left -->
        <polygon points="10,80 35,80 30,190 15,190" fill="#17241b"/>
        <line x1="12" y1="95" x2="33" y2="175" stroke="#7da585" stroke-width="1.2"/>
        <line x1="33" y1="95" x2="12" y2="175" stroke="#7da585" stroke-width="1.2"/>
        <rect x="5" y="65" width="35" height="15" fill="#294030"/>

        <!-- Norse Longhouse -->
        <path d="M 55 130 Q 110 80 170 120 L 175 190 L 55 190 Z" fill="#223628"/>
        <!-- Curved Roof Ridge -->
        <path d="M 45 130 Q 110 70 180 115" fill="none" stroke-width="3.5"/>
        <!-- Doorway -->
        <rect x="100" y="150" width="25" height="40" fill="#0c150f"/>
        <!-- Torches / Lanterns glow -->
        <circle cx="90" cy="155" r="4" fill="#e0eae2"/>
        <circle cx="135" cy="155" r="4" fill="#e0eae2"/>
      </g>

      <text x="112" y="275" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">UNREAL ENGINE 5 • LIGHTING</text>
    </g>

    <!-- Right: Alchemist's Workbench Props -->
    <g transform="translate(255, 0)">
      <rect x="0" y="0" width="225" height="300" fill="#131e16" stroke="#e0eae2" stroke-width="2"/>
      <rect x="15" y="15" width="195" height="22" fill="#e0eae2"/>
      <text x="112" y="30" fill="#121d15" font-family="'Space Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">ALCHEMIST'S WORKBENCH</text>

      <!-- Workbench Table & Props Illustration -->
      <g transform="translate(20, 70)" stroke="#e0eae2" stroke-width="2">
        <!-- Heavy Wooden Table -->
        <rect x="10" y="140" width="165" height="15" fill="#253a2b"/>
        <line x1="25" y1="155" x2="25" y2="190" stroke-width="4"/>
        <line x1="160" y1="155" x2="160" y2="190" stroke-width="4"/>

        <!-- Fantasy Lantern on Table -->
        <g transform="translate(35, 80)" fill="#1e3024">
          <polygon points="12,0 20,10 4,10"/>
          <rect x="4" y="10" width="16" height="35" rx="2" stroke-width="1.8"/>
          <circle cx="12" cy="28" r="5" fill="#e0eae2" stroke="none"/>
          <rect x="0" y="45" width="24" height="6" rx="1"/>
        </g>

        <!-- Potion Flasks -->
        <g transform="translate(80, 105)" fill="#1c2d22">
          <path d="M 12 0 L 12 12 Q 0 25 5 35 L 20 35 Q 25 25 12 12 Z"/>
          <circle cx="12" cy="26" r="4" fill="#7da585" stroke="none"/>
        </g>
        <g transform="translate(105, 115)" fill="#1c2d22">
          <circle cx="12" cy="15" r="10"/>
          <rect x="9" y="0" width="6" height="7"/>
        </g>

        <!-- Stacked Parchment & Books -->
        <g transform="translate(130, 120)" fill="#25382b">
          <rect x="0" y="12" width="30" height="8" rx="1"/>
          <rect x="2" y="4" width="26" height="8" rx="1"/>
        </g>
      </g>

      <text x="112" y="275" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">MAYA • SUBSTANCE • UNREAL</text>
    </g>
  </g>

  <!-- Technical Spec Labels -->
  <rect x="50" y="50" width="220" height="24" fill="#e0eae2"/>
  <text x="160" y="66" fill="#121d15" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">MODULAR 3D ASSETS</text>

  <text x="50" y="530" fill="#e0eae2" font-family="'Space Mono', monospace" font-size="18" font-weight="900" letter-spacing="2">ENVIRONMENT &amp; PROP ART</text>
  <text x="50" y="555" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="11" letter-spacing="1">UNREAL ENGINE • MAYA • MODULAR WORKFLOW</text>
</svg>
