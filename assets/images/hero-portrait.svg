<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.12"/>
    </pattern>
    <filter id="grungeRough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  
  <!-- Base Background -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  <rect width="600" height="700" fill="url(#dotPattern)"/>
  
  <!-- Abstract Geometric Brutalist Portrait Silhouette -->
  <g opacity="0.85">
    <!-- Shoulder & Torso Contour -->
    <path d="M 120 700 C 130 540, 200 480, 240 450 L 360 450 C 400 480, 470 540, 480 700 Z" fill="#222222" stroke="#444444" stroke-width="2"/>
    <!-- Head Outline -->
    <ellipse cx="300" cy="300" rx="110" ry="145" fill="#2d2d2d" stroke="#555555" stroke-width="2"/>
    <!-- Stylized Shadow & Contrast -->
    <path d="M 300 155 C 370 155, 410 215, 410 300 C 410 385, 370 445, 300 445 Z" fill="#1b1b1b" opacity="0.7"/>
    <!-- Sunglasses / Brutalist Mask -->
    <rect x="230" y="270" width="60" height="32" rx="4" fill="#111111" stroke="#ffffff" stroke-width="2"/>
    <rect x="310" y="270" width="60" height="32" rx="4" fill="#111111" stroke="#ffffff" stroke-width="2"/>
    <line x1="290" y1="286" x2="310" y2="286" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Grunge Graphic Overlays & Crosshairs -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.4">
    <line x1="40" y1="40" x2="100" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="100"/>
    
    <line x1="560" y1="40" x2="500" y2="40"/>
    <line x1="560" y1="40" x2="560" y2="100"/>
    
    <line x1="40" y1="660" x2="100" y2="660"/>
    <line x1="40" y1="660" x2="40" y2="600"/>
    
    <line x1="560" y1="660" x2="500" y2="660"/>
    <line x1="560" y1="660" x2="560" y2="600"/>
    
    <!-- Focus Grid -->
    <circle cx="300" cy="350" r="180" fill="none" stroke-dasharray="8 6"/>
    <line x1="300" y1="130" x2="300" y2="570" stroke-dasharray="4 4"/>
    <line x1="80" y1="350" x2="520" y2="350" stroke-dasharray="4 4"/>
  </g>

  <!-- Technical Stamp Labels -->
  <rect x="40" y="590" width="160" height="26" fill="#ffffff"/>
  <text x="120" y="608" fill="#000000" font-family="'Space Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">PORTRAIT // 01</text>
  
  <text x="560" y="640" fill="#ffffff" opacity="0.6" font-family="'Space Mono', monospace" font-size="11" text-anchor="end" letter-spacing="1">ISO 400 • 50MM • F/1.8</text>
</svg>
