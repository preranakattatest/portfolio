<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="p2Grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#303030"/>
      <stop offset="100%" stop-color="#101010"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#p2Grad)"/>
  
  <!-- Minimalist Brutalist Luxury E-Commerce Layout -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.8">
    <rect x="80" y="80" width="440" height="440"/>
    <line x1="80" y1="300" x2="520" y2="300"/>
    <line x1="300" y1="80" x2="300" y2="520"/>
  </g>
  
  <!-- Center Emblem -->
  <circle cx="300" cy="300" r="90" fill="#141414" stroke="#ffffff" stroke-width="3"/>
  <circle cx="300" cy="300" r="70" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 6"/>
  <polygon points="300,240 350,330 250,330" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="300" cy="300" r="14" fill="#ffffff"/>

  <!-- Editorial Typography Elements -->
  <text x="100" y="125" fill="#ffffff" font-family="'Courier New', monospace" font-size="14" font-weight="bold" letter-spacing="3">LUMINA</text>
  <text x="100" y="145" fill="#888888" font-family="'Courier New', monospace" font-size="10" letter-spacing="1">COLLECTION 2025</text>
  
  <text x="500" y="125" fill="#ffffff" font-family="'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="end" letter-spacing="2">EDITION 02</text>
  
  <text x="100" y="490" fill="#ffffff" font-family="'Courier New', monospace" font-size="20" font-weight="bold" letter-spacing="6">COMMERCE</text>
  <text x="500" y="490" fill="#888888" font-family="'Courier New', monospace" font-size="12" text-anchor="end" letter-spacing="2">WEB • BRAND</text>
</svg>
