<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18271e"/>
      <stop offset="100%" stop-color="#0f1a13"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bgNoise)"/>
  
  <!-- Technical Grid -->
  <g stroke="#e0eae2" stroke-width="1" opacity="0.12">
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
  </g>

  <!-- Hospital Device Schematic -->
  <g transform="translate(100, 110)">
    <!-- Outer Bezel Frame -->
    <rect x="0" y="0" width="400" height="280" rx="8" fill="#1b2920" stroke="#e0eae2" stroke-width="3"/>
    
    <!-- Recessed Screen Seat -->
    <rect x="25" y="25" width="350" height="230" rx="4" fill="#0c140f" stroke="#e0eae2" stroke-width="2"/>
    
    <!-- Screen Glass & Decibel Gauge -->
    <rect x="40" y="40" width="320" height="200" fill="#132018"/>
    
    <!-- Gauge Meter Arc -->
    <path d="M 120 160 A 80 80 0 0 1 280 160" fill="none" stroke="#253a2b" stroke-width="14" stroke-linecap="round"/>
    <path d="M 120 160 A 80 80 0 0 1 230 95" fill="none" stroke="#e0eae2" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Decibel Readout -->
    <text x="200" y="150" fill="#f2f7f3" font-family="'Space Mono', monospace" font-size="34" font-weight="900" text-anchor="middle">43.3 dB</text>
    <text x="200" y="175" fill="#7da585" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="1">HOSPITAL NOISE MONITOR</text>

    <!-- Microphone probe on bottom right -->
    <rect x="330" y="280" width="22" height="60" rx="4" fill="#0c140f" stroke="#e0eae2" stroke-width="2"/>
    <ellipse cx="341" cy="340" rx="15" ry="10" fill="#1c2d22" stroke="#e0eae2" stroke-width="2"/>

    <!-- Side Perforated Pattern -->
    <g transform="translate(20, 295)" fill="#e0eae2" opacity="0.6">
      <circle cx="0" cy="0" r="2.5"/><circle cx="12" cy="0" r="2.5"/><circle cx="24" cy="0" r="2.5"/><circle cx="36" cy="0" r="2.5"/>
      <circle cx="6" cy="8" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="30" cy="8" r="2.5"/>
      <circle cx="0" cy="16" r="2.5"/><circle cx="12" cy="16" r="2.5"/><circle cx="24" cy="16" r="2.5"/><circle cx="36" cy="16" r="2.5"/>
    </g>
  </g>

  <!-- Technical Spec Labels -->
  <rect x="50" y="50" width="210" height="24" fill="#e0eae2"/>
  <text x="155" y="66" fill="#121d15" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">SPACE OPTIMISATION</text>

  <text x="50" y="530" fill="#e0eae2" font-family="'Space Mono', monospace" font-size="18" font-weight="900" letter-spacing="2">NOISE SENSOR ENCLOSURE</text>
  <text x="50" y="555" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="11" letter-spacing="1">RECESSED SCREEN INTEGRATION • PCB FIT</text>
</svg>
