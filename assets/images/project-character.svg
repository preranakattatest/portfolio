<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2d22"/>
      <stop offset="100%" stop-color="#0f1912"/>
    </linearGradient>
    <pattern id="meshNet" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 24 24 M 24 0 L 0 24" stroke="#e0eae2" stroke-width="0.7" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bgChar)"/>
  <rect width="600" height="600" fill="url(#meshNet)"/>

  <!-- Brutalist Split Layout for Character Studies -->
  <g transform="translate(60, 90)">
    <!-- Left Panel: Stylised Imp Creature Silhouette & Silhouette Vector -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="300" fill="#142118" stroke="#e0eae2" stroke-width="2"/>
      <rect x="15" y="15" width="190" height="22" fill="#e0eae2"/>
      <text x="110" y="30" fill="#121d15" font-family="'Space Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">IMPINA // CREATURE STUDY</text>
      
      <!-- Stylised Imp Silhouette & Wings -->
      <g transform="translate(110, 160)" stroke="#e0eae2" stroke-width="1.8" fill="#1d2e23">
        <!-- Horns -->
        <path d="M -15 -45 Q -35 -70 -50 -60 Q -35 -45 -22 -35 Z"/>
        <path d="M 15 -45 Q 35 -70 50 -60 Q 35 -45 22 -35 Z"/>
        <!-- Head -->
        <ellipse cx="0" cy="-30" rx="35" ry="25"/>
        <!-- Big Expressive Eyes -->
        <ellipse cx="-15" cy="-32" rx="12" ry="9" fill="#e0eae2"/>
        <ellipse cx="15" cy="-32" rx="12" ry="9" fill="#e0eae2"/>
        <!-- Wings -->
        <path d="M -25 -20 Q -70 -45 -75 -15 Q -55 5 -20 5 Z" fill="#294030"/>
        <path d="M 25 -20 Q 70 -45 75 -15 Q 55 5 20 5 Z" fill="#294030"/>
        <!-- Body & Tail -->
        <path d="M -15 -5 Q 0 45 10 50 Q -25 70 -20 90" fill="none" stroke-width="3"/>
        <circle cx="35" cy="15" r="14" fill="#7da585" stroke="#e0eae2"/>
      </g>

      <text x="110" y="275" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">ZBRUSH • STYLISED ANATOMY</text>
    </g>

    <!-- Right Panel: Undead Sculpt Bust & Wireframe Topology -->
    <g transform="translate(260, 0)">
      <rect x="0" y="0" width="220" height="300" fill="#142118" stroke="#e0eae2" stroke-width="2"/>
      <rect x="15" y="15" width="190" height="22" fill="#e0eae2"/>
      <text x="110" y="30" fill="#121d15" font-family="'Space Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">UNDEAD // BUST STUDY</text>

      <!-- Stylised Female Bust with Braids -->
      <g transform="translate(110, 155)" stroke="#e0eae2" stroke-width="1.8" fill="#1d2e23">
        <!-- Neck & Torso -->
        <path d="M -30 65 L -15 25 L 15 25 L 30 65 Z"/>
        <!-- Head -->
        <ellipse cx="0" cy="-20" rx="30" ry="40"/>
        <!-- Braids flowing down -->
        <path d="M -26 -15 Q -40 20 -30 60 Q -20 80 -25 90" fill="none" stroke-width="6" stroke-linecap="round"/>
        <path d="M 26 -15 Q 40 20 30 60 Q 20 80 25 90" fill="none" stroke-width="6" stroke-linecap="round"/>
        <!-- Forehead runic symbol & Eyes -->
        <circle cx="0" cy="-40" r="8" fill="none" stroke-dasharray="2 2"/>
        <ellipse cx="-12" cy="-20" rx="8" ry="6" fill="#e0eae2"/>
        <ellipse cx="12" cy="-20" rx="8" ry="6" fill="#e0eae2"/>
        <!-- Wireframe overlay lines -->
        <path d="M -30 -20 Q 0 -10 30 -20 M -28 0 Q 0 10 28 0 M 0 -60 L 0 20" stroke="#7da585" stroke-width="0.9" fill="none"/>
      </g>

      <text x="110" y="275" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">ZBRUSH • MAYA • SUBSTANCE</text>
    </g>
  </g>

  <!-- Technical Spec Labels -->
  <rect x="50" y="50" width="220" height="24" fill="#e0eae2"/>
  <text x="160" y="66" fill="#121d15" font-family="'Space Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle" letter-spacing="1">3D DIGITAL SCULPTING</text>

  <text x="50" y="530" fill="#e0eae2" font-family="'Space Mono', monospace" font-size="18" font-weight="900" letter-spacing="2">CHARACTER &amp; CREATURE ART</text>
  <text x="50" y="555" fill="#9eb5a3" font-family="'Space Mono', monospace" font-size="11" letter-spacing="1">ZBRUSH • MAYA • SUBSTANCE 3D PAINTER</text>
</svg>
