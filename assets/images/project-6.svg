<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#131313"/>
  
  <!-- Health Metrics / Biometric Grids -->
  <circle cx="300" cy="270" r="130" fill="none" stroke="#333333" stroke-width="20"/>
  <circle cx="300" cy="270" r="130" fill="none" stroke="#ffffff" stroke-width="20" stroke-dasharray="550 300" stroke-linecap="round"/>
  
  <text x="300" y="275" fill="#ffffff" font-family="'Courier New', monospace" font-size="36" font-weight="bold" text-anchor="middle">98.4</text>
  <text x="300" y="305" fill="#888888" font-family="'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="2">BPM // OPTIMAL</text>
  
  <!-- Lower technical cards -->
  <g fill="#202020" stroke="#333333" stroke-width="1">
    <rect x="80" y="440" width="130" height="80"/>
    <rect x="235" y="440" width="130" height="80"/>
    <rect x="390" y="440" width="130" height="80"/>
  </g>
  
  <text x="145" y="475" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle">8.4H</text>
  <text x="145" y="498" fill="#888888" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">SLEEP CYCLE</text>

  <text x="300" y="475" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle">2,410</text>
  <text x="300" y="498" fill="#888888" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">CALORIES</text>

  <text x="455" y="475" fill="#ffffff" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle">94%</text>
  <text x="455" y="498" fill="#888888" font-family="'Courier New', monospace" font-size="9" text-anchor="middle">RECOVERY</text>
  
  <text x="80" y="80" fill="#ffffff" font-family="'Courier New', monospace" font-size="18" font-weight="bold" letter-spacing="3">ZENITH HEALTH // 06</text>
</svg>
